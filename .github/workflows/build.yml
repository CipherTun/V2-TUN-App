name: Build AAR and APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      lib_repo:
        description: "Tunnel library repository"
        default: "CipherTun/V2-TUN"
      lib_ref:
        description: "Tunnel library branch, tag or commit"
        default: "fix/review-20261104"

env:
  LIB_REPO: ${{ inputs.lib_repo || 'CipherTun/V2-TUN' }}
  LIB_REF: ${{ inputs.lib_ref || 'fix/review-20261104' }}
  NDK_VERSION: "27.2.12479018"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: compile the Go tunnel library into an Android AAR with gomobile.
  build-aar:
    name: Build v2tun.aar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the tunnel library
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIB_REPO }}
          ref: ${{ env.LIB_REF }}
          path: V2-TUN

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: V2-TUN/go.mod
          cache-dependency-path: V2-TUN/go.sum

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Bind the library (same command as setup.sh)
        working-directory: V2-TUN
        run: |
          go mod tidy
          go get golang.org/x/mobile/bind
          gomobile bind -target=android -javapkg=io.surprise -o "$GITHUB_WORKSPACE/v2tun.aar" io.surprise.vpn/mobile
          ls -lh "$GITHUB_WORKSPACE/v2tun.aar"

      - name: Upload the AAR
        uses: actions/upload-artifact@v4
        with:
          name: v2tun-aar
          path: v2tun.aar
          if-no-files-found: error

  # Job 2: runs only after the AAR exists. Uses setup.sh with the prebuilt AAR.
  build-apk:
    name: Build APKs
    needs: build-aar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download the AAR next to setup.sh
        uses: actions/download-artifact@v4
        with:
          name: v2tun-aar
          path: .

      - name: Create the Flutter project (setup.sh picks up v2tun.aar)
        run: |
          test -f v2tun.aar
          bash setup.sh "$RUNNER_TEMP/v2tun_flutter"

      - name: Build release APKs
        working-directory: ${{ runner.temp }}/v2tun_flutter
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP"/v2tun_flutter/build/app/outputs/flutter-apk/app-*-release.apk dist/
          cd dist
          for f in app-*-release.apk; do mv "$f" "V2-TUN-${f#app-}"; done
          ls -lh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: v2tun-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs and AAR to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            v2tun.aar
